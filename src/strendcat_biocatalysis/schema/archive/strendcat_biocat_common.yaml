    slot_uri: SIO:000008
    # is_a: has_qualitative_attribute #PROBLEMATIC CAUSE "has_..." HAS INLINED:TRUE (not allowed for enums)
    range: InhibitionTypeEnum
    description: >-
      The type of enzyme inhibition observed (competitive, non-competitive,
