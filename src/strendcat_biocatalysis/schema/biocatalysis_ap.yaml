    inlined: true

  has_yield_and_conversion:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: YieldAndConversion
    description: Yield and conversion metrics for the biocatalytic reaction.
    inlined: true

  has_activity_and_reaction_rate:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: ActivityAndInitialReactionRate
    description: Activity and initial reaction rate measurements.
    inlined: true

  has_selectivity_and_specificity:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: SelectivityAndSpecificity
    description: Selectivity and specificity parameters for the reaction.
    inlined: true

  has_thermodynamic_parameters:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: ThermodynamicParameters
    description: Thermodynamic parameters for the biocatalytic reaction.
    inlined: true

  has_michaelis_constant:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: MichaelisConstant
    description: The Michaelis-Menten constant (Km) of the enzyme.

  has_maximum_reaction_rate:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: MaximumReactionRate
    description: The maximum reaction rate (Vmax) of the enzyme.

  has_turnover_number:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: TurnoverNumber
    description: The turnover number (kcat) of the enzyme.

  has_catalytic_efficiency:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: CatalyticEfficiency
    description: The catalytic efficiency (kcat/Km) of the enzyme.

  has_dissociation_constant:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: DissociationConstant
    description: The dissociation constant (Kd) of the enzyme-substrate complex.

  has_hill_coefficient:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: HillCoefficient
    description: The Hill coefficient describing binding cooperativity.

  has_inhibition_characterisation:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: EnzymeInhibitionCharacterisation
    description: Inhibition type and constant for the enzyme.
    inlined: true

  has_enzyme_stability:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: EnzymeStabilityCharacterisation
    description: Stability characterisation of the biocatalyst.
    inlined: true

  inhibition_type:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: InhibitionTypeEnum
    description: >-
      The type of enzyme inhibition observed (competitive, non-competitive,
      uncompetitive, mixed, or irreversible).

  has_inhibition_constant:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: InhibitionConstant
    description: The inhibition constant (Ki) of the inhibitor.

  has_half_life:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: HalfLife
    description: >-
      The half-life of the biocatalyst under defined conditions.

  stability_description:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Qualitative description of enzyme stability including activity decline
      profile and preservation conditions.

  has_space_time_yield:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: SpaceTimeYield
    description: >-
      The mass of product obtained per unit volume per unit time
      (volumetric productivity).

  has_substrate_conversion:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: SubstrateConversion
    description: >-
      The percentage of substrate converted to desired product.

  has_specific_activity:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: SpecificActivity
    description: Specific activity of the biocatalyst.

  has_initial_reaction_rate:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: InitialReactionRate
    description: Initial reaction rate in the first 10% of the reaction.

  has_enantioselectivity_ratio:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: EnantioselectivityRatio
    description: Enantiomeric ratio (E) of the biocatalytic reaction.

  has_enantiomeric_excess:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: EnantiomericExcess
    description: Enantiomeric excess (ee) of the product.

  has_diastereomeric_excess:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: DiastereomericExcess
    description: Diastereomeric excess (de) of the product.

  has_isomeric_content:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: IsomericContent
    description: Isomeric content of the product as a percentage.

  stereoselectivity_description:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Qualitative description of stereoselectivity — the preference of the
      reaction to produce a specific stereoisomer or spatial arrangement.

  chemoselectivity_description:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Qualitative description of chemoselectivity — the ability to target
      a specific functional group without affecting others.

  regioselectivity_description:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Qualitative description of regioselectivity — the preference for
      reaction at a specific site within the molecule.

  has_gibbs_free_energy_change:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: GibbsFreeEnergyChange
    description: Change in Gibbs free energy (delta G) for the reaction.

  has_enthalpy_change:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: EnthalpyChange
    description: Change in enthalpy (delta H) for the reaction.

  # --- BiocatalyticExperiment slots ---

  has_operation_mode:
    slot_uri: dcterms:type
