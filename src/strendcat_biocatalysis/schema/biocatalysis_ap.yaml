    description: >-
      The reaction vessel in which the biocatalytic reaction took place.
    recommended: true

  has_sampling_process:
    slot_uri: BFO:0000051
    is_a: has_part
    range: SamplingProcess
    multivalued: true
    inlined_as_list: true
    description: >-
      Sampling processes carried out during the BiocatalyticExperiment.

  # --- Missing slots identified in self-critique ---

  has_amount:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: QuantitativeAttribute
    description: >-
      The amount of a gas phase present in the reaction medium or headspace,
