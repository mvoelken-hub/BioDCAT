---
id: https://w3id.org/mvoelken-hub/StrenDCAT-Biocatalysis
name: StrenDCAT-Biocatalysis
title: StrenDCAT-Biocatalysis
description: |-
  Aligning StrendaBiocatalysis guidelines to the DCAT-AP Plus schema.
license: MIT
see_also:
  - https://mvoelken-hub.github.io/StrenDCAT-Biocatalysis

prefixes:
  strendcat_biocatalysis: https://w3id.org/mvoelken-hub/StrenDCAT-Biocatalysis/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: https://example.org/
default_prefix: strendcat_biocatalysis
default_range: string

classes:
# --- reaction condition classes ---
  TemperatureShiftProcess:
    is_a: PlannedProcess
    description: >-
      A PlannedProcess representing an event-based change in temperature
      during a biocatalytic reaction.
    todos:
      - Identify specific OBI or AFP subclass URI for temperature shift
    slots:
      - has_temperature_before
      - has_temperature_after
      - has_trigger_event
      - has_temperature_at_timepoint

  TemperatureGradient:
    is_a: PlannedProcess
    description: >-
      A PlannedProcess representing a dynamic temperature gradient applied
      over distance or time in a tubular flow reactor.
    todos:
      - Identify specific OBI or AFP subclass URI for temperature gradient
    slots:
      - has_temperature_start
      - has_temperature_end
      - has_gradient_length
      - has_measurement_points

  PHShiftProcess:
    is_a: PlannedProcess
    description: >-
      A PlannedProcess representing an event-based change in pH during a
      biocatalytic reaction.
    todos:
      - Identify specific OBI or AFP subclass URI for pH shift process
    slots:
      - has_ph_before
      - has_ph_after
      - has_trigger_event
      - has_ph_at_timepoint
      - has_ph_measurement

  PHGradient:
    is_a: PlannedProcess
    description: >-
      A PlannedProcess representing a dynamic pH gradient applied over
      distance or time in a tubular flow reactor.
    todos:
      - Identify specific OBI or AFP subclass URI for pH gradient process
    slots:
      - has_ph_start
      - has_ph_end
      - has_gradient_length
      - has_measurement_points
      - has_ph_measurement

  PHMeasurementProcess:
    is_a: MeasurementProcess
    class_uri: OBI:0000070
    description: >-
      A MeasurementProcess capturing the method and context of pH measurement,
      including when it was measured and by which method. Retained for
      reproducibility provenance; acknowledged as potentially deeper than
      strictly necessary for this schema.
    slots:
      - has_ph_value
      - detected_when
      - detected_how
      - has_temperature
      - has_calibration_info

  MeasurementProcess:
    class_uri: OBI:0000070
    is_a: PlannedProcess
    description: >-
      A planned process that has the objective to produce information about
      a material entity by examining it. (OBI:0000070 stub)
    todos:
      - Replace with direct OBI import

  ReactionMedium:
    is_a: MaterialEntity
    class_uri: CHMO:0000892
    description: >-
      The medium in which a biocatalytic reaction takes place, described by
      its phase composition, ionic strength, and additives.
    slots:
      - has_phase_count
      - has_liquid_phase
      - has_solid_phase
      - has_gas_phase
      - has_ionic_strength
      - has_medium_additive
    slot_usage:
      description:
        description: >-
          Free-text description of additional medium characteristics
          (STRENDA special_treatment fallback, P-001).

  LiquidPhase:
    is_a: MaterialEntity
    class_uri: CHMO:0002722
    description: A liquid phase present in the reaction medium.
    slots:
      - has_liquid_type
      - has_volume

  SolidPhase:
    is_a: MaterialEntity
    class_uri: CHMO:0002723
    description: A solid phase present in the reaction medium.
    slots:
      - has_solid_type
      - has_mass

  GasPhase:
    is_a: MaterialEntity
    class_uri: CHMO:0002724
    description: A gas phase present in the reaction medium or headspace.
    slots:
      - has_gas_type
      - has_amount

# --- range classes ---
  TemperatureTimepoint:
    is_a: QuantitativeAttribute
    description: >-
      A temperature value recorded at a specific time point during a
      temperature shift or profile.
    slots:
      - has_temperature
      - has_time_value

  IonicStrength:
    is_a: QuantitativeAttribute
    description: >-
      Ionic strength calculated from dissolved ions in the solvent,
      I = 0.5 * sum(ci * zi^2).
    close_mappings:
      - PATO:0001655

slots:
  has_temperature_before:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: Temperature
    description: The temperature prior to the event causing a temperature shift.

  has_temperature_after:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: Temperature
    description: The temperature after the event causing a temperature shift.

  has_trigger_event:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Description of the event that triggered a temperature or pH shift
      (e.g. addition of substrate, planned time-point in fed-batch protocol).

  has_temperature_at_timepoint:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: TemperatureTimepoint
    multivalued: true
    inlined_as_list: true
    description: Temperature values recorded at specific timepoints during a shift.

  has_temperature_start:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: Temperature
    description: The initial temperature from which a temperature gradient begins.

  has_temperature_end:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: Temperature
    description: The target temperature reached after a temperature gradient.

  has_gradient_length:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: QuantitativeAttribute
    description: >-
      The distance or time span over which a temperature or pH gradient
      is applied.

  has_measurement_points:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Information about locations or timepoints where temperature or pH
      measurements are taken to monitor the gradient.
  
  has_ph_before:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: PHValue
    description: The pH prior to the event causing a pH shift.

  has_ph_after:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: PHValue
    description: The pH after the event causing a pH shift.

  has_ph_start:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: PHValue
    description: The initial pH from which a pH gradient begins.

  has_ph_end:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: PHValue
    description: The target pH reached after a pH gradient.

  has_ph_at_timepoint:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: PHValue
    multivalued: true
    inlined_as_list: true
    description: pH values recorded at specific timepoints during a shift.

  has_ph_measurement:
    slot_uri: SIO:000008
    range: PHMeasurementProcess
    description: >-
      The measurement process used to determine the pH value, capturing
      method and measurement context for reproducibility.
    inlined: true
  
  detected_when:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Specification of when the pH was measured (before, during, or after
      the reaction; whether all components were present).

  detected_how:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      The method used to measure pH (e.g. pH meter, pH paper, titration,
      electrochemical sensor).

  has_calibration_info:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Calibration conditions for the pH electrode, especially if differing
      from standard (20-25°C buffer calibration).


  has_phase_count:
    slot_uri: SIO:000008
    range: integer
    description: >-
      The number of distinct phases present in the reaction medium
      (e.g. 2 for aqueous + gas phase).

  has_liquid_phase:
    slot_uri: BFO:0000051
    is_a: has_part
    range: LiquidPhase
    multivalued: true
    inlined_as_list: true
    description: A liquid phase present in the reaction medium.

  has_solid_phase:
    slot_uri: BFO:0000051
    is_a: has_part
    range: SolidPhase
    multivalued: true
    inlined_as_list: true
    description: A solid phase present in the reaction medium.

  has_gas_phase:
    slot_uri: BFO:0000051
    is_a: has_part
    range: GasPhase
    multivalued: true
    inlined_as_list: true
    description: A gas phase present in the reaction medium or headspace.

  has_ionic_strength:
    slot_uri: SIO:000008
    is_a: has_quantitative_attribute
    range: IonicStrength
    description: The ionic strength of the reaction medium.

  has_medium_additive:
    slot_uri: BFO:0000051
    is_a: has_part
    #range: ChemicalSubstance
    multivalued: true
    inlined_as_list: true
    description: >-
      Additional substances in the reaction medium such as cosolvents or
      ionic strength adjusters. Optional role annotation via CHEBI role
      hierarchy recommended.

  has_liquid_type:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      The type of liquid phase (e.g. aqueous buffer, organic solvent,
      mixed aqueous-organic).

  has_solid_type:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      The type of solid phase (e.g. support material, solid catalyst,
      precipitate).

  has_gas_type:
    slot_uri: SIO:000008
    is_a: has_qualitative_attribute
    range: string
    description: >-
      The type of gas present (e.g. nitrogen, oxygen, carbon dioxide, argon).