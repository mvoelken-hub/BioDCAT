# --- EnzymeML specific slots ---

  given_name:
    slot_uri: schema:givenName
    is_a: has_qualitative_attribute
    range: string
    description: Given name of a document creator/contributor.

  family_name:
    slot_uri: schema:familyName
    is_a: has_qualitative_attribute
    range: string
    description: Family name of a document creator/contributor.

  mail:
    slot_uri: schema:email
    is_a: has_qualitative_attribute
    range: string
    description: Email address of a document creator/contributor.

  has_complex_participant:
    slot_uri: BFO:0000051
    is_a: has_part
    description: >-
      A participant of a MolecularComplex. Covers both the ChemicalEntity
      branch (SmallMolecule/BiocatalyticComponent/nested MolecularComplex)
      and the AgenticEntity branch (Biocatalyst), which is why any_of is
      used instead of a single range.
    range: ChemicalEntity
    multivalued: true
    inlined_as_list: true
    any_of:
      - range: ChemicalEntity
      - range: Biocatalyst

  has_constant_concentration:
    slot_uri: RO:0000086
    range: boolean
    description: >-
      Whether the concentration of this component/preparation is treated as
      constant throughout the experiment (EnzymeML "constant" on
      Protein/Complex/SmallMolecule). Distinct from a vessel's volume being
      constant -- see has_constant_volume on ReactionVessel, and distinct
      from a KineticModelParameter being fixed -- see is_fixed_parameter.

  has_constant_volume:
    slot_uri: RO:0000086
    range: boolean
    description: >-
      Whether the volume of a vessel is treated as constant throughout the
      experiment (EnzymeML Vessel "constant").

  equation_species_reference:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Reference (id or name) of the species this equation's left-hand side
      refers to. Kept as a plain string deliberately, since the referenced
      species may be a Biocatalyst, BiocatalyticComponent or
      MolecularComplex (three different, incompatible class branches) --
      resolving this into a typed link is left to the converter.

  equation_type:
    slot_uri: RO:0000086
    range: KineticEquationTypeEnum
    description: The role this KineticEquation plays within the kinetic model.

  has_equation_variable:
    slot_uri: BFO:0000051
    is_a: has_part
    range: EquationVariable
    multivalued: true
    inlined_as_list: true
    description: The variables that appear in this KineticEquation's expression.

  has_kinetic_equation:
    slot_uri: BFO:0000051
    is_a: has_part
    range: KineticEquation
    multivalued: true
    inlined_as_list: true
    description: >-
      Kinetic model equation(s) describing this BiocatalyticReaction,
      including but not limited to its rate law (EnzymeML Reaction
      kinetic_law and the document-level equations pool).

  has_kinetic_model_parameter:
    slot_uri: BFO:0000051
    is_a: has_part
    range: KineticModelParameter
    multivalued: true
    inlined_as_list: true
    description: >-
      Estimated or fixed kinetic model parameters associated with this
      BiocatalyticReaction (EnzymeML Parameter pool, referenced by symbol
      from KineticEquation expressions).

  parameter_symbol:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: The symbol used for this parameter in kinetic equations (e.g. "Km").

  initial_value:
    slot_uri: RO:0000086
    range: float
    description: >-
      The initial value used for this parameter before optimization/fitting.
      Assumed to share the same unit as the parameter's own value.

  upper_bound:
    slot_uri: RO:0000086
    range: float
    description: >-
      The upper bound used for this parameter during optimization/fitting.

  lower_bound:
    slot_uri: RO:0000086
    range: float
    description: >-
      The lower bound used for this parameter during optimization/fitting.

  stderr:
    slot_uri: RO:0000086
    range: float
    description: The standard error of the estimated parameter value.

  is_fitted:
    slot_uri: RO:0000086
    range: boolean
    description: Whether this parameter was varied during optimization/fitting.

  is_fixed_parameter:
    slot_uri: RO:0000086
    range: boolean
    description: >-
      Whether this parameter is treated as fixed/constant rather than
      estimated (EnzymeML Parameter "constant"). Distinct from is_fitted:
      EnzymeML keeps both fields independently, so both are carried through
      as-is rather than collapsed into one.

  is_reversible:
    slot_uri: RO:0000086
    range: boolean
    description: Whether the reaction is reversible (EnzymeML Reaction "reversible").

  organism_taxonomy_id:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: >-
      A taxonomy database identifier (e.g. NCBI Taxonomy ID) for the
      organism named in origin_organism.

  measurement_group_id:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: >-
      User-defined identifier linking together several EnzymeMeasurements
      that belong to the same experimental series.

  has_measurement_species_data:
    slot_uri: BFO:0000051
    is_a: has_part
    range: EnzymeMeasurementSpeciesData
    multivalued: true
    inlined_as_list: true
    description: Per-species time-course data recorded within this measurement.

  measured_species_reference:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    description: >-
      Reference (id or name) of the measured species. Kept as a plain string
      for the same reason as equation_species_reference above.

  prepared_amount:
    slot_uri: RO:0000086
    range: float
    description: >-
      The amount of the species present before the measurement started
      (EnzymeML MeasurementData "prepared").

  initial_amount:
    slot_uri: RO:0000086
    range: float
    description: >-
      The amount of the species at the first recorded data point (EnzymeML
      MeasurementData "initial").

  measurement_data_type:
    slot_uri: RO:0000086
    range: MeasurementDataTypeEnum
    description: The physical/analytical nature of the recorded data series.

  is_simulated:
    slot_uri: RO:0000086
    range: boolean
    description: Whether this data series was generated by simulation rather than measured.

  has_timepoint:
    slot_uri: BFO:0000051
    is_a: has_part
    range: MeasurementTimepoint
    multivalued: true
    inlined_as_list: true
    description: The individual (time, value) data points of this series.

  synonymous_names:
    slot_uri: RO:0000053
    is_a: has_qualitative_attribute
    range: string
    multivalued: true
    description: >-
      Alternative names by which this component is also known (EnzymeML
      SmallMolecule "synonymous_names").
